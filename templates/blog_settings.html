{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">

            <h3>ニュース設定</h3>

        </div>

        <div class="card-body">

            <p class="text-muted">

                興味のあるキーワードを3つまで登録できます。<br>
                毎日初回アクセス時にAIがニュース記事を自動生成します。

            </p>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">

                        キーワード①

                    </label>

                    {{ form.keyword1 }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        キーワード②

                    </label>

                    {{ form.keyword2 }}

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        キーワード③

                    </label>

                    {{ form.keyword3 }}

                </div>

                <button
                    class="btn btn-primary"
                    type="submit">

                    保存

                </button>

                <a
                    href="{% url 'blog' %}"
                    class="btn btn-secondary">

                    今日の記事を見る

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
